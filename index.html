<!DOCTYPE html>
<html data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HUNGER MAP</title>
    <link rel="icon" href="./icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica:ital@0;1&family=IM+Fell+Double+Pica:ital@0;1&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://pixijs.download/release/pixi.min.js"></script>

    <style>
        .navbar-brand {
            font-size: 1.75rem!important;
            font-family: 'IM Fell DW Pica', serif;
        }

        .navbar {
            font-size: 1.5rem!important;
        }

        .navbar-brand img {
            width: 40px !important;
            height: 40px !important;
        }

        #view-container {
            width: 100%;
            height: 100vh;
            overflow:hidden;
        }

        #tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            display: none;
            z-index: 9999;
            white-space: pre;
        }
    </style>

    <!-- App -->
<!--    <link href="./styles.css?v={{ site.time | date_to_xmlschema }}" rel="stylesheet"/>-->
<!--    <script type="importmap">-->
<!--        {"imports": {-->
<!--            './util.js': './util.js?v={{ site.time | date_to_xmlschema }}',-->
<!--            './fabric-util.js': './fabric-util.js?v={{ site.time | date_to_xmlschema }}',-->
<!--            './constants.js': './constants.js?v={{ site.time | date_to_xmlschema }}',-->
<!--            './data.js': './data.js?v={{ site.time | date_to_xmlschema }}',-->
<!--        }}-->
<!--    </script>-->
    <script src="./script.js?v={{ site.time | date_to_xmlschema }}" type="module"></script>

    <!-- Analytics -->
    <script defer data-domain="mattw.io" src="https://plausible.io/js/plausible.js"></script>
</head>
<body>

<div class="container-fluid">
    <div class="row gy-2 gx-3 align-items-center p-3" hidden>
        <div class="col-auto">
            <label>Scale</label>
            <input class="form-control" type="number" id="scale" value="0.05" step="0.001">
        </div>
        <div class="col-auto">
            <label>OffsetX</label>
            <input class="form-control" type="number" id="offsetX" value="0" step="25">
        </div>
        <div class="col-auto">
            <label>OffsetY</label>
            <input class="form-control" type="number" id="offsetY" value="0" step="25">
        </div>
        <div class="col-auto">
            <label>Rotation (degrees)</label>
            <input class="form-control" type="number" id="rotation" value="0" step="1">
        </div>
    </div>

    <div class="row">
        <div class="col-md-3 m-0 p-0">
            <nav class="navbar bg-body-tertiary">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">
                        <img src="./icon.png" alt="Logo" width="30" height="30" class="d-inline-block align-text-top">
                        HUNGER MAP
                    </a>
                </div>
            </nav>

            <div class="p-3">
                <div class="mb-3">
                    <h5>Select Map</h5>
                    <select class="form-select" id="mapSelect">
                        <option value="map01.webp">Sarlat</option>
                        <option value="map02.webp">Jacques</option>
                        <option value="map03.webp">Sombre</option>
                    </select>
                </div>

                <div class="mb-3">
                    <h5>Search Nodes</h5>
                    <input class="form-control" type="text" id="searchBox" placeholder="Type to filter...">
                </div>

                <div class="mb-3">
                    <h5>Options</h5>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="showOnlyMatches" checked>
                        <label class="form-check-label" for="showOnlyMatches">
                            Search show only matches
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="hideAiSpawner" checked>
                        <label class="form-check-label" for="hideAiSpawner">
                            Hide AISpawner
                        </label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="filterZrange">
                        <label class="form-check-label" for="filterZrange">
                            Filter on Height
                        </label>
                    </div>
                    <div class="mb-3">
                        <label for="zRange" class="form-label">Z Lowest -> Highest</label>
                        <input type="range" class="form-range" id="zRange" min="0" max="100" value="0" step="10">
                    </div>
                </div>


            </div>
        </div>
        <div class="col-md-9 p-0">
            <div id="view-container"></div>
        </div>
    </div>

    <div id="tooltip"></div>
</div>

</body>
</html>
