<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    {% assign cache_buster = site.time | date_to_xmlschema -%}

    <title>HUNGER MAP (TT3)</title>
    <meta charset="UTF-8">
    <meta name="version" content="{{ cache_buster }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description"
          content="View map data for the upcoming game HUNGER">
    <link rel="icon" href="./icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica:ital@0;1&family=IM+Fell+Double+Pica:ital@0;1&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-multiselect@2.0.0/dist/css/bootstrap-multiselect.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-multiselect@2.0.0/dist/js/bootstrap-multiselect.min.js"></script>
    <script src="https://pixijs.download/release/pixi.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/clipboard@2.0.11/dist/clipboard.min.js"></script>

    <!-- App -->
    <link href="./styles.css?v={{ cache_buster }}" rel="stylesheet"/>
    <script type="importmap">
        {"imports": {
            "data": "./js/data.js?v={{ cache_buster }}",
            "dom": "./js/dom.js?v={{ cache_buster }}",
            "marker": "./js/marker.js?v={{ cache_buster }}",
            "pixi": "./js/pixi.js?v={{ cache_buster }}",
            "textures": "./js/textures.js?v={{ cache_buster }}"
        }}
    </script>
    <script type="module" src="./js/main.js?v={{ cache_buster }}"></script>

    <!-- Analytics -->
    <script defer data-domain="mattw.io" src="https://plausible.io/js/plausible.js"></script>
</head>
<body>

<div class="container-fluid">
    <div id="data-adjust" class="row gy-2 gx-3 justify-content-center p-3" style="display: none;">
        <div class="col-auto">
            <label>Scale</label>
            <input class="form-control" type="number" id="scale" value="0.05" step="0.0001">
        </div>
        <div class="col-auto">
            <label>OffsetX</label>
            <input class="form-control" type="number" id="offsetX" value="0" step="1">
        </div>
        <div class="col-auto">
            <label>OffsetY</label>
            <input class="form-control" type="number" id="offsetY" value="0" step="1">
        </div>
        <div class="col-auto">
            <label>Rotation (degrees)</label>
            <input class="form-control" type="number" id="rotation" value="0" step="1">
        </div>
    </div>

    <div class="row">
        <div class="col-md-3 m-0 p-0">
            <nav class="navbar sticky-top bg-body-tertiary" style="z-index: 999999">
                <div class="container-fluid d-flex justify-content-center">
                    <a class="navbar-brand" href="#">
                        HUNGER
                        <img src="./icon.png" alt="Logo" width="30" height="30" class="d-inline-block align-text-top">
                        MAPS
                        <sup class="text-muted" style="font-size:0.85rem;font-family:system-ui">TT3</sup>
                    </a>
                </div>
            </nav>

            <div class="p-3 flex-grow-1 overflow-y-auto">
                <div class="mb-3">
                    <h6>Select Map</h6>
                    <select class="form-select" id="mapSelect">
                        <option value="map00">The Chateau</option>
                        <option value="map01">Sarlat Farm</option>
                        <option value="map02">Jacques Bridge</option>
                        <option value="map03">Sombre Forest</option>
                    </select>
                    <div class="form-check mt-1">
                        <input class="form-check-input" type="checkbox" value="" id="showOverlay" checked>
                        <label class="form-check-label" for="showOverlay">
                            Show overlay
                        </label>
                    </div>
                </div>

                <div class="mb-3">
                    <h6 class="mb-0">
                        Search
                        <i class="bi bi-info-circle" data-bs-toggle="tooltip" data-bs-placement="right" data-bs-html="true"
                           title="<strong>Special Keywords</strong>: breakable, charcoal, egg, good, locked, profession, quest, thick branch"></i>
                    </h6>
                    <input class="form-control mb-1 mt-1" type="text" id="searchBox" placeholder="Type to filter...">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="showOnlyMatches" checked>
                        <label class="form-check-label" for="showOnlyMatches">
                            Show only matches
                        </label>
                    </div>
                </div>

                <div class="mb-3">
                    <h6>Height Filter</h6>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="filterZrange">
                        <label class="form-check-label" for="filterZrange">
                            Enable (Lowest ⟶ Highest)
                        </label>
                    </div>
                    <div class="mb-3">
                        <input type="range" class="form-range" id="zRange" min="0" max="100" value="0" step="10">
                    </div>
                </div>

                <div class="mb-3 d-flex justify-content-center">
                    <a id="showAll" href="javascript:">Show All</a>
                    &nbsp;
                    &nbsp;
                    &nbsp;
                    <a id="hideAll" href="javascript:">Hide All</a>
                </div>

                <div class="row filters">
                    <div class="col-lg-6">
                        <div class="mb-3">
                            <h6>
                                Containers
                                <img src="./img/T_UI_Icon_PingGeneric.png">
                                <img src="./img/T_UI_Item_FreshEgg.png">
                            </h6>
                            <select id="loot-select" multiple="multiple" style="display:none"></select>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="mb-3">
                            <h6>
                                Loose Items
                                <img src="./img/T_UI_Icon_Equipment_Equipment_64.png">
                            </h6>
                            <select id="loose-select" multiple="multiple" style="display:none"></select>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="mb-3">
                            <h6>
                                Environment
                                <img src="./img/T_UI_Icon_Mic_Transmitting.png">
                                <img src="./img/T_UI_Item_GrenadeCeramic.png">
                                <img src="./img/T_UI_Profession_Conservator.png">
                            </h6>
                            <select id="env-select" multiple="multiple" style="display:none"></select>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="mb-3">
                            <h6>
                                Creatures
                                <img src="./img/T_UI_Icon_PM_HungerKill.png">
                            </h6>
                            <select id="creature-select" multiple="multiple" style="display:none"></select>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="mb-3">
                            <h6>
                                Quest
                                <img src="./img/T_UI_Icon_TrackerHandIn.png">
                            </h6>
                            <select id="quest-select" multiple="multiple" style="display:none"></select>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="mb-3">
                            <h6>
                                Spawns
                                <img src="./img/T_UI_Icon_Social.png">
                                <img src="./img/T_UI_Icon_Extract_64.png">
                            </h6>
                            <select id="spawns-select" multiple="multiple" style="display:none"></select>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="mb-3">
                            <h6>
                                Other
                                <img src="./img/T_UI_Icon_Rarity_Uncommon.png">
                            </h6>
                            <select id="other-select" multiple="multiple" style="display:none"></select>
                        </div>
                    </div>
                </div>

                <div class="form-check" hidden>
                    <input class="form-check-input" type="checkbox" value="" id="hideAiSpawner" checked>
                    <label class="form-check-label" for="hideAiSpawner">
                        Hide AISpawner
                    </label>
                </div>

            </div>
        </div>
        <div class="col-md-9 p-0">
            <div id="view-container"></div>
        </div>
    </div>

    <div id="tooltip"></div>
</div>

</body>
</html>
